name: Update ONS employment data

on:
  schedule:
    # Runs monthly on the 20th at 08:00 UTC
    # ONS publishes EMP13 roughly every 3 months (Feb, May, Aug, Nov)
    # Monthly checks ensure we catch it within weeks of release
    - cron: '0 8 20 * *'
  workflow_dispatch:  # also allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pandas xlrd openpyxl

      - name: Fetch and parse ONS EMP13
        run: python scripts/fetch_ons.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update ONS EMP13 data $(date +'%Y-%m-%d')"
          git push
